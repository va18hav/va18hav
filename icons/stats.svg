<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220" fill="none">
  <rect x="0.5" y="0.5" width="379" height="219" rx="8" fill="#ffffff" stroke="#e1e4e8" />

  <text x="22" y="34" fill="#0969da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
