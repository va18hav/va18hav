    <rect x="2" y="9" width="12" height="5" rx="1" />
    <circle cx="4.5" cy="4.5" r="0.5" fill="#57606a" />
    <circle cx="4.5" cy="11.5" r="0.5" fill="#57606a" />
  </g>
  <text x="48" y="118" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500">Backend &amp; APIs</text>
  <text x="212" y="118" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500">FastAPI, Node.js</text>

