  </g>
  <text x="48" y="146" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500">Queues &amp; Streaming</text>
  <text x="212" y="146" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500">Redis, ARQ, BullMQ, SSE</text>

