  </g>
  <text x="48" y="62" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500">Primary Languages</text>
  <text x="212" y="62" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500">Python, TypeScript</text>

  <!-- Row 2: Agentic Frameworks -->
  <g transform="translate(22, 78)" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="4" r="2.5" />
    <circle cx="4" cy="13" r="2.5" />
    <circle cx="12" cy="13" r="2.5" />
    <line x1="6.8" y1="6.2" x2="5" y2="10.8" />
